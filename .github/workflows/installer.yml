name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build Pulpit.exe
        run: pyinstaller --noconfirm --clean pulpit.spec

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile setup
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\pulpit.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Pulpit-Setup
          path: dist/installer/Pulpit-Setup.exe
          if-no-files-found: error
          retention-days: 14
