name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Validate visual builder JavaScript
        run: node --check pulpit/web/app.js

      - name: Test engines and site export
        run: |
          python -m pip install pytest
          python -m pytest tests -q

      - name: Build Pulpit.exe
        run: pyinstaller --noconfirm --clean pulpit.spec

      - name: Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile setup
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\pulpit.iss

      - name: Publish release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.12.0' }}
          target_commitish: main
          name: Pulpit 1.12.0
          body: |
            ## Pulpit 1.12.0
            - Универсальный инфракрасный пульт: Broadlink RM/RM4, ESP32 USB-IR и Home Assistant.
            - Обучение с оригинального пульта, профили устройств, импорт Flipper .ir и Pronto HEX.
            - Сборка установщика Windows после полного прогона тестов.
          files: dist/installer/Pulpit-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove superseded releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $keep = "v1.12.0"
          $releases = gh release list --limit 100 --json tagName | ConvertFrom-Json
          foreach ($release in $releases) {
            if ($release.tagName -ne $keep) {
              gh release delete $release.tagName --yes --cleanup-tag
              if ($LASTEXITCODE -ne 0) {
                throw "Не удалось удалить старый релиз $($release.tagName)"
              }
            }
          }

      - name: Upload installer
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Pulpit-Setup
          path: dist/installer/Pulpit-Setup.exe
          if-no-files-found: error
          retention-days: 14
